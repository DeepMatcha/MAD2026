name: Backend CI

on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]

permissions:
  contents: read

jobs:
  contract-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test public API consumer
        run: >
          ./gradlew --no-daemon --console=plain
          :backend:assembleDebug :backend:testDebugUnitTest
          :contract:testDebugUnitTest :demo-data:testDebugUnitTest
          :on-device-litert:testDebugUnitTest :app:assembleDebug
